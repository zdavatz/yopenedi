# https://www.playframework.com/documentation/latest/Configuration
{
    "edifact-orders": "./edifact_orders"
    "opentrans-orders": "./opentrans_orders"
    "edifact-order-responses": "./edifact_order_responses"
    "opentrans-order-responses": "./opentrans_order_responses"
    "edifact-despatch-advices" : "./edifact_despatch_advices",
    "opentrans-dispatch-notifications": "./opentrans_dispatch_notifications",
    "edifact-invoices" : "./edifact_invoices",
    "opentrans-invoices": "./opentrans_invoices",
    # "cert": "cert.crt",
    # "private-key": "private-key.key",
    "environment": ${?ENVIRONMENT}
    "conversion-config": ${?CONVERSION_CONFIG}

    play.filters.hosts {
        allowed = ["localhost:9000", ".yopenedi.ch", "104.248.255.2"]
    }
    play.http.parser.maxMemoryBuffer = 5MB
    play.http.parser.maxDiskBuffer = 100MB
    parsers.anyContent.maxLength = 100MB

    # Pool used by HomeController for conversion and for dispatching results to
    # partners. Kept separate from Play's default dispatcher so that slow or
    # unresponsive partners can never starve the threads that serve requests.
    contexts {
        blocking-io-dispatcher {
            executor = "thread-pool-executor"
            throughput = 1
            thread-pool-executor {
                fixed-pool-size = 32
            }
        }
    }

    # Outgoing async MDN requests. Play's defaults for these are generous and
    # `request` is unbounded, which is how one unresponsive partner used to tie up
    # a connection indefinitely.
    play.ws.timeout.connection = 30 seconds
    play.ws.timeout.idle = 60 seconds
    play.ws.timeout.request = 120 seconds

    # Backstop for inbound requests: if a handler somehow still blocks, answer the
    # caller with a 503 instead of leaving them to hit their own read timeout.
    play.server.http.idleTimeout = 180 seconds
    play.server.pekko.requestTimeout = 120 seconds
}
